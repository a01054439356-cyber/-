<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>회원가입 · 먹스닥</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/signup.css"></head>
<body class="su" data-root="">
<main>
  <h1 class="t">회원가입</h1><p class="st">먹스닥과 함께 더 똑똑한 외식을 시작하세요!</p>
  <section class="bn"><div class="fe"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="1"/><path d="M12 9v12M3 13h18M12 9C9 9 7 7.500 8 6s3 0 4 3c1-3 3-4.500 4-3s-1 3-4 3z"/></svg>맞춤 외식 제안</div><div class="fe"><svg viewBox="0 0 24 24"><path d="M3 8l4 3 5-6 5 6 4-3-2 11H5z"/></svg>할인 혜택</div><div class="fe"><svg viewBox="0 0 24 24"><ellipse cx="10" cy="8" rx="6" ry="2.500"/><path d="M4 8v4c0 1.400 2.700 2.500 6 2.500s6-1.100 6-2.500V8M4 12v4c0 1.400 2.700 2.500 6 2.500s6-1.100 6-2.500v-4"/></svg>포인트 적립</div><div class="ph">M</div></section>
  <div class="stp"><div class="s on"><i>1</i>본인인증</div><span class="ln"></span><div class="s"><i>2</i>정보 입력</div><span class="ln"></span><div class="s"><i>3</i>가입 완료</div></div>

  <section class="bx"><div class="h"><svg viewBox="0 0 24 24"><rect x="6" y="2.500" width="12" height="19" rx="2.500"/><path d="M10 18.500h4M12 8l3 1.200v2.800c0 2-1.300 3.300-3 4-1.700-.7-3-2-3-4V9.200z"/></svg><div><b>본인 인증 (통신사 인증)</b><small>본인 명의의 휴대폰 번호로 간편하게 인증해요.</small></div></div>
    <div class="fi"><label class="in" id="cbx"><svg viewBox="0 0 24 24"><path d="M12 12v9M8 21h8M7.500 16.500a6 6 0 0 1 0-9M16.500 7.500a6 6 0 0 1 0 9M4.500 19a10 10 0 0 1 0-14M19.500 5a10 10 0 0 1 0 14"/></svg><select id="cr"><option value="">통신사 선택</option><option>SKT</option><option>KT</option><option>LG U+</option><option>알뜰폰 SKT</option><option>알뜰폰 KT</option><option>알뜰폰 LG U+</option></select></label></div>
    <div class="fi"><label class="in" id="phx"><svg viewBox="0 0 24 24"><rect x="7" y="2.500" width="10" height="19" rx="2"/><path d="M11 18.500h2"/></svg><input id="ph" inputmode="numeric" maxlength="11" placeholder="휴대폰 번호 ('-' 없이 숫자만)"></label><button class="gb" id="snd">인증번호 받기</button></div>
    <div class="fi"><label class="in" id="cdx"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.500-3.400 8-8 9-4.600-1-8-4.500-8-9V6z"/><path d="M8.500 12l2.500 2.500 4.500-5"/></svg><input id="cd" inputmode="numeric" maxlength="6" placeholder="인증번호 6자리 입력"><span class="tm" id="tm"></span></label><button class="gb gray" id="vf" disabled>인증확인</button></div>
    <div class="msg n" id="m1"></div></section>

  <section class="tm2"><div class="al" id="all"><span class="ck on" id="ck0"></span>약관에 전체 동의합니다.</div>
    <div class="tl bad" data-k="a"><span class="ck sq"></span><span>(필수) 이용약관 동의</span><span class="g" data-v="a">›</span></div>
    <div class="tl" data-k="b"><span class="ck sq"></span><span>(필수) 개인정보 수집 및 이용 동의</span><span class="g" data-v="b">›</span></div>
    <div class="tl" data-k="c"><span class="ck sq"></span><span>(선택) 마케팅 정보 수신 동의 <small>(이벤트·추천·혜택 안내)</small></span><span class="g" data-v="c">›</span></div></section>

  <button class="cta" id="nx">다음</button>
  <p class="lg">이미 계정이 있으신가요? <a href="index.html">로그인하기</a></p>
</main>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<script src="assets/common.js"></script>
<script>
MK.init({public:true,back:true});
const S=()=>{try{return JSON.parse(sessionStorage.getItem('mk_su'))||{}}catch(e){return {}}},W=o=>{try{sessionStorage.setItem('mk_su',JSON.stringify({...S(),...o}))}catch(e){}};
let code='',exp=0,timer=null,verified=!!S().verified;
const T={a:['이용약관','제1조(목적) 이 약관은 먹스닥이 제공하는 외식 혜택·수요지수·결제 서비스의 이용 조건과 절차를 정합니다.','제2조(이용자의 의무) 이용자는 본인 명의의 정보로 가입하고 계정 정보를 안전하게 관리해야 해요.','※ 화면용 샘플 약관이에요.'],
 b:['개인정보 수집 및 이용','수집 항목: 이름, 휴대폰 번호, 이메일, 아이디','이용 목적: 본인 확인, 서비스 제공, 포인트 적립·결제 처리','보유 기간: 회원 탈퇴 시까지 (관련 법령에 따라 일정 기간 보관)','※ 화면용 샘플 안내예요.'],
 c:['마케팅 정보 수신','이벤트, 맞춤 혜택, 추천 매장 소식을 알림으로 받아볼 수 있어요. 동의하지 않아도 서비스를 이용할 수 있고, 언제든지 변경할 수 있어요.']};
let agree=S().terms||{a:false,b:false,c:false};
const msg=(t,c)=>{m1.textContent=t;m1.className='msg '+(c||'')};
const ph=document.getElementById('ph');
/* 본인인증 */
function paint(){document.querySelectorAll('.tl').forEach(l=>{const k=l.dataset.k;l.querySelector('.ck').classList.toggle('on',agree[k]);l.querySelector('.ck').textContent=agree[k]?'✓':'';l.classList.remove('bad')});
  const all=agree.a&&agree.b&&agree.c;ck0.classList.toggle('on',all);ck0.textContent=all?'✓':''}
document.querySelectorAll('.tl').forEach(l=>l.onclick=e=>{const k=l.dataset.k;if(e.target.dataset.v){const t=T[e.target.dataset.v];sheet.innerHTML='<h3>'+t[0]+'</h3>'+t.slice(1).map(x=>'<p>'+x+'</p>').join('')+'<button id="cl">확인</button>';ov.classList.add('on');cl.onclick=()=>ov.classList.remove('on');return}agree[k]=!agree[k];W({terms:agree});paint()});
all.onclick=()=>{const v=!(agree.a&&agree.b&&agree.c);agree={a:v,b:v,c:v};W({terms:agree});paint()};
ov.onclick=e=>{if(e.target===ov)ov.classList.remove('on')};
cr.onchange=()=>{cr.classList.toggle('has',!!cr.value);cbx.classList.remove('bad')};
ph.oninput=()=>{ph.value=ph.value.replace(/\D/g,'');phx.classList.remove('bad')};cd.oninput=()=>{cd.value=cd.value.replace(/\D/g,'');cdx.classList.remove('bad');vf.disabled=verified||cd.value.length!==6;vf.classList.toggle('gray',vf.disabled)};
function lock(){[cr,ph,cd].forEach(x=>x.disabled=true);snd.disabled=true;vf.disabled=true;[cbx,phx,cdx].forEach(x=>x.classList.add('ok'));tm.textContent='';msg('본인인증이 완료되었어요.','ok');vf.textContent='인증완료';vf.classList.remove('gray');vf.classList.add('on')}
snd.onclick=()=>{let bad=false;
  if(!cr.value){cbx.classList.add('bad');bad=true}
  if(!/^01[016789]\d{7,8}$/.test(ph.value)){phx.classList.add('bad');bad=true}
  if(bad)return msg(!cr.value?'통신사를 선택해 주세요.':'휴대폰 번호를 정확히 입력해 주세요.');
  code=String(Math.floor(100000+Math.random()*900000));exp=Date.now()+180000;snd.textContent='재전송';cd.value='';cd.focus();vf.disabled=true;vf.classList.add('gray');
  msg('인증번호를 보냈어요. [테스트용] 인증번호: '+code,'n');
  clearInterval(timer);timer=setInterval(()=>{const s=Math.max(0,Math.round((exp-Date.now())/1000));tm.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(!s){clearInterval(timer);tm.textContent='';code='';msg('인증 시간이 지났어요. 인증번호를 다시 받아 주세요.')}},500)};
vf.onclick=()=>{if(!code)return msg('먼저 인증번호를 받아 주세요.');if(Date.now()>exp)return msg('인증 시간이 지났어요. 인증번호를 다시 받아 주세요.');
  if(cd.value!==code){cdx.classList.add('bad');return msg('인증번호가 일치하지 않아요.')}
  verified=true;clearInterval(timer);W({verified:true,phone:ph.value,carrier:cr.value});lock();paint()};
nx.onclick=()=>{if(!verified){msg('본인인증을 먼저 완료해 주세요.');return}if(!(agree.a&&agree.b)){document.querySelectorAll('.tl').forEach(l=>{if(!agree[l.dataset.k]&&l.dataset.k!=='c')l.classList.add('bad')});return}location.href='signup-info.html'};
if(verified){const s=S();cr.value=s.carrier||'';cr.classList.add('has');ph.value=s.phone||'';cd.value='••••••';lock()}
paint();
</script>
</body></html>
